<section class="flex flex-col gap-6">
  <header class="space-y-2">
    <p class="text-sm font-semibold uppercase tracking-wide text-slate-700">
      {{ 'PLAY.TAG' | translate }}
    </p>
    <h1 class="text-3xl font-semibold text-slate-900">
      {{ 'PLAY.TITLE' | translate }}
    </h1>
  </header>

  <div class="grid gap-4 md:grid-cols-2">
    <app-play-status
      [statusLabelKey]="store.statusLabelKey()"
      [isActive]="store.isActive()"
      [hasError]="store.hasError()"
      [errorMessageKey]="store.errorMessageKey()"
      [pitchNoteLabel]="store.pitchNoteLabel()"
      [volumeDb]="store.volumeDb()"
    />

    <app-play-camera
      [aspectRatio]="cameraAspect()"
      (cameraReady)="onCameraReady($event)"
      (overlayReady)="onOverlayReady($event)"
    />
  </div>

  <app-play-manual-controls
    [pitchValue]="store.pitchHz()"
    [pitchMin]="settings.minHz()"
    [pitchMax]="settings.maxHz()"
    [gainValue]="store.gain()"
    [pitchNoteLabel]="store.pitchNoteLabel()"
    [volumeDb]="store.volumeDb()"
    (pitchChange)="setPitch($event)"
    (gainChange)="setGain($event)"
  />

  <app-play-actions
    [canStart]="store.canStart()"
    [isActive]="store.isActive()"
    [shouldPulseStart]="store.shouldPulseStart()"
    [recordingLabelKey]="store.recordingLabelKey()"
    (startPressed)="start()"
    (stopPressed)="stop()"
    (recordPressed)="toggleRecording()"
  />
</section>
