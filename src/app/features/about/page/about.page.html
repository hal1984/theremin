<section class="flex flex-col gap-6">
  <header class="space-y-2">
    <p class="text-sm font-semibold uppercase tracking-wide text-slate-700">
      {{ 'ABOUT.TAG' | translate }}
    </p>
    <h1 class="text-3xl font-semibold text-slate-900">
      {{ 'ABOUT.TITLE' | translate }}
    </h1>
    <p class="text-base text-slate-600">
      {{ 'ABOUT.DESCRIPTION' | translate }}
    </p>
  </header>

  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <img
      ngSrc="/assets/images/joya_theremin.jpg"
      width="1200"
      height="800"
      alt="{{ 'ABOUT.IMAGE_ALT' | translate }}"
      class="h-auto w-full rounded-xl object-cover"
    />
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <h2 class="text-lg font-semibold text-slate-900">
      {{ 'ABOUT.COMPAT_TITLE' | translate }}
    </h2>
    <p class="mt-2 text-sm text-slate-600">
      {{ 'ABOUT.COMPAT_DESC' | translate }}
    </p>
  </div>
</section>
